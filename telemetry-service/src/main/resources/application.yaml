spring:
  application:
    name: telemetry-service
  datasource:
    url: ${TELEMETRY_DB_URL:jdbc:postgresql://localhost:5433/telemetry}
    username: ${TELEMETRY_DB_USER:telemetry}
    password: ${TELEMETRY_DB_PASSWORD:local-dev-only}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${TELEMETRY_CONSUMER_GROUP:telemetry-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": br.com.rafaelpvs.telemetry_service.consumers.telemetry.events
        "[spring.json.value.default.type]": br.com.rafaelpvs.telemetry_service.consumers.telemetry.events.TelemetryReceivedEvent
        "[spring.json.use.type.headers]": false
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8083}

app:
  kafka:
    topics:
      telemetry-received: ${TELEMETRY_RECEIVED_TOPIC:telemetry.received}
