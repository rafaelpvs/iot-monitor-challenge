spring:
  application:
    name: ingestion-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false

server:
  port: ${SERVER_PORT:8082}

app:
  clients:
    device-service:
      base-url: ${DEVICE_SERVICE_URL:http://localhost:8080}
  kafka:
    topics:
      telemetry-received:
        name: ${TELEMETRY_RECEIVED_TOPIC:telemetry.received}
        partitions: ${TELEMETRY_RECEIVED_PARTITIONS:3}
        replication-factor: ${TELEMETRY_RECEIVED_REPLICATION_FACTOR:1}
