spring:
  application:
    name: alert-service
  datasource:
    url: ${ALERT_DB_URL:jdbc:postgresql://localhost:5434/alerts}
    username: ${ALERT_DB_USER:alerts}
    password: ${ALERT_DB_PASSWORD:local-dev-only}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${ALERT_CONSUMER_GROUP:alert-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": br.com.rafaelpvs.alert_service.consumers.telemetry.events
        "[spring.json.value.default.type]": br.com.rafaelpvs.alert_service.consumers.telemetry.events.TelemetryReceivedEvent
        "[spring.json.use.type.headers]": false
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8084}

app:
  clients:
    device-service:
      base-url: ${DEVICE_SERVICE_URL:http://localhost:8080}
  kafka:
    topics:
      telemetry-received: ${TELEMETRY_RECEIVED_TOPIC:telemetry.received}

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
