spring:
  application:
    name: device-service
  datasource:
    url: ${DEVICE_DB_URL:jdbc:postgresql://localhost:5432/devices}
    username: ${DEVICE_DB_USER:devices}
    password: ${DEVICE_DB_PASSWORD:local-dev-only}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
